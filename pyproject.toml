[project]
name = "agente-rrhh"
version = "1.0.0"
description = "Agente de IA para resolver dudas de empleados sobre políticas laborales y prestaciones (RRHH)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.15,<3",
    "litellm>=1.80,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pyjwt>=2.9,<3",
    "fastembed>=0.5,<1",
    "numpy>=1.26,<3",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # permitimos acentos y signos del español

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
