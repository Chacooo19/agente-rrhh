name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  calidad:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Ruff (lint y formato)
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest -q

  imagen:
    name: Build de la imagen Docker
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nombre de imagen en minúsculas (requisito de GHCR)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Login a GHCR (solo en tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (y publicación en tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # En PRs la referencia es "N/merge" (no es una etiqueta válida): usamos una local.
          tags: ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', env.IMAGEN, github.ref_name) || 'agente-rrhh:ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
